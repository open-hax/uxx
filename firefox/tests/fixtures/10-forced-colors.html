<!DOCTYPE html>
<!--
  SPDX-License-Identifier: GPL-3.0-or-later
  Fixture 10/12 — forced-colors (design §6: every injected rule is wrapped
  in @media screen and (forced-colors: none); under active, the OS palette
  wins; research B §5.8).

  Scenario: normal light page; forced-colors must be exercised by
  EMULATION, not by CSS on the page (the media feature is OS-controlled).

  How to test (manual E2E):
  - Firefox DevTools → ⋮ → Rendering → "Emulate CSS media feature
    forced-colors: active" (or OS-level forced-colors/High Contrast).
    Then reload with the extension enabled.

  Expected outcomes:
  - With forced-colors: active, NONE of our injected rules apply (boot,
    role, inline-redirect sheets are all gated by `forced-colors: none`) —
    the page renders in the system/OS palette exactly as if the extension
    were absent, with no half-themed hybrid.
  - The content pipeline does not crash in forced mode; markers
    (data-uxx-role) may still be written but their sheet rules are inert.
  - Toggling forced-colors back off restores full theming without reload.
  - The injected sheets must contain `forced-colors: none` and must NEVER
    contain the invalid value `no-preference` (a review blocker — dead
    rules otherwise).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>10 forced-colors</title>
<style>
  body { margin: 0; padding: 2rem; background: #ffffff; color: #111; font-family: sans-serif; }
  a { color: #1d4ed8; }
  .badge { background: #dcfce7; color: #166534; padding: .25rem .75rem; border-radius: 999px; }
</style>
</head>
<body>
  <h1>forced-colors fixture</h1>
  <p>Normal text with a <a href="#">link</a> and a <span class="badge">green badge</span>.</p>
  <p>Use DevTools Rendering → emulate <code>forced-colors: active</code>,
     then verify the page follows the OS palette with zero extension rules.</p>
</body>
</html>
