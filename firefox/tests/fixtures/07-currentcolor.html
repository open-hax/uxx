<!DOCTYPE html>
<!--
  SPDX-License-Identifier: GPL-3.0-or-later
  Fixture 07/12 — currentColor / inherit (design §6 "currentColor/inherit/
  transparent/initial/unset/none": cascade-following — no marker, inherits
  the remapped ancestor; research B §5.3).

  Scenario: a container sets the color; children use `color: currentColor`,
  `color: inherit`, and an SVG whose stroke is `currentColor`. A second
  group uses `initial`/`unset`/`inherit` keywords explicitly.

  Expected outcomes (manual E2E):
  - Elements whose computed color comes from currentColor/inherit get NO
    color marker of their own — they render with the ancestor's remapped
    Monokai token through the cascade.
  - The container itself is marked and themed; the currentColor children
    visibly match it.
  - The SVG stroke follows the themed ancestor color (currentColor
    resolution happens at computed-value time, after the ancestor is
    themed).
  - `color: initial` elements are treated as the initial value (black) and
    mapped as normal text — no special crash; `unset` on an inheritable
    property behaves as inherit.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>07 currentColor</title>
<style>
  body { margin: 0; padding: 2rem; background: #ffffff; color: #222; font-family: sans-serif; }
  .ancestor { color: #7c3aed; border: 1px solid #ddd; padding: 1rem; }
  .via-current { color: currentColor; }
  .via-inherit { color: inherit; }
  .via-initial { color: initial; }
  .via-unset { color: unset; }
  svg { display: block; margin-top: .5rem; }
</style>
</head>
<body>
  <h1>currentColor / inherit cascade</h1>
  <div class="ancestor">
    <p>Ancestor sets the color.</p>
    <p class="via-current">color: currentColor — no marker, follows ancestor.</p>
    <p class="via-inherit">color: inherit — no marker, follows ancestor.</p>
    <svg width="120" height="40"><circle cx="20" cy="20" r="14" fill="none" stroke="currentColor" stroke-width="4"></circle>
      <text x="44" y="26">SVG stroke=currentColor</text></svg>
  </div>
  <p class="via-initial">color: initial — computed black, themed as normal text.</p>
  <p class="via-unset">color: unset — inherits (inheritable property).</p>
</body>
</html>
