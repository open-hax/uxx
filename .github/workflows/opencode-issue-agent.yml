name: OpenCode Kimi Issue Agent

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - '.github/workflows/opencode-issue-agent.yml'
      - '.github/scripts/assessment*'
      - '.github/scripts/fixtures/uxx14-native-*.json'
      - '.github/assessment-tools/**'
      - '.github/workflows/eta-mu-review.yml'

jobs:
  issue-triage:
    name: Triage issue with OpenCode
    if: ${{ github.event_name == 'issues' && github.event.issue.pull_request == null }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run OpenCode issue triage
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIMI_API_KEY: ${{ secrets.KIMI_FOR_CODING_API_KEY }}
        with:
          model: kimi-for-coding/k2p5
          use_github_token: true
          prompt: |
            You are the Kimi issue agent for this repository. Triage the triggering GitHub issue.

            Kanban context:
            - Check whether the issue body contains an `openhax-kanban-sync` marker.
            - If it does, treat the synced markdown Kanban card as task intent and preserve status/priority labels unless the issue clearly moved.
            - If the repository has a kanban/ directory or docs/agent-workflows.md, use it to understand workflow vocabulary.
            - Do not create duplicate issues for work already represented by a synced Kanban issue.

            Goals:
            - Decide whether the issue is actionable, duplicate, irrelevant, spam, or needs more information.
            - If the issue is clearly irrelevant, spam, out of scope, or a duplicate, leave a concise explanatory comment and close it.
            - If the issue is valid but underspecified, ask specific follow-up questions and leave it open.
            - If a small, safe code or documentation fix is appropriate, create a branch, commit the fix, and open a pull request linked to the issue.
            - If the work is larger or risky, leave an implementation plan and keep the issue open.

            Guardrails:
            - Do not close an issue when the evidence is ambiguous.
            - Do not make broad rewrites, dependency churn, secret changes, or destructive changes.
            - Prefer minimal pull requests with tests or documentation updates when applicable.
            - Never print secrets or credentials.

  scoped-assessment-contract:
    name: Scoped assessment transport contract
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: riatzukiza/.agents
          ref: 0f95afe56fb01fbcf9d7934b72ce31fe96baf451
          path: .assessment-policy
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: open-hax/proxx
          ref: 2810f4515424a146fe37390fb0baf532cca31236
          path: .assessment-runtime
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - name: Install pinned portable test runtime
        working-directory: .github/assessment-tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test actual adapter and guarded workflow
        run: .github/assessment-tools/node_modules/.bin/nbb -cp .github/scripts:.assessment-policy/skills/pr-flow/scripts .github/scripts/assessment_route_test.cljs
      - name: Verify read-token collaborator-permission API
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            // This diagnostic uses the same read-only job scopes as intake.
            // It proves endpoint reachability, not scoped assessment admission.
            let response;
            try {
              response = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: 'open-hax', repo: 'uxx', username: 'riatzukiza',
              });
            } catch (error) {
              const status = Number.isInteger(error?.status) ? error.status : 'unknown';
              core.setFailed(`Read-token permission diagnostic failed (HTTP ${status}).`);
              return;
            }
            const permission = response?.data?.permission;
            if (response?.status !== 200 || !['admin', 'maintain', 'write', 'triage', 'read', 'none'].includes(permission)) {
              core.setFailed('Read-token permission diagnostic returned invalid status or permission.');
              return;
            }
            core.info(JSON.stringify({ repository: 'open-hax/uxx', login: 'riatzukiza', status: response.status, permission }));

  scoped-assessment-read:
    name: Independent bounded Uxx14 assessment
    if: ${{ github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.issue.number == 14 && github.event.issue.pull_request != null && github.event.comment.user.type == 'User' && startsWith(github.event.comment.body, '/opencode assess-actionability ') }}
    concurrency:
      group: opencode-kimi-assessment-14
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-name: ${{ steps.assessment-artifact.outputs.name }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      ASSESSMENT_POLICY: .assessment-policy/skills/pr-flow
    steps:
      # issue_comment executes the default-branch workflow, never PR code.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: riatzukiza/.agents
          ref: 0f95afe56fb01fbcf9d7934b72ce31fe96baf451
          path: .assessment-policy
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: open-hax/proxx
          ref: 2810f4515424a146fe37390fb0baf532cca31236
          path: .assessment-runtime
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - name: Install pinned portable runtime
        working-directory: .github/assessment-tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/.github/assessment-tools/node_modules/.bin" >> "$GITHUB_PATH"
          {
            echo "ASSESSMENT_INPUT=$RUNNER_TEMP/assessment-input.edn"
            echo "ASSESSMENT_RESULT=$RUNNER_TEMP/assessment-result.edn"
          } >> "$GITHUB_ENV"
      - name: Verify transport contract before intake
        run: nbb -cp .github/scripts:.assessment-policy/skills/pr-flow/scripts .github/scripts/assessment_route_test.cljs
      - name: Capture complete current native and Git context
        env:
          GH_TOKEN: ${{ github.token }}
          ASSESSMENT_COMMAND: intake
        run: nbb -cp .github/scripts:.assessment-policy/skills/pr-flow/scripts .github/scripts/assessment_route.cljs
      - name: Install immutable OpenCode runtime after admission
        env:
          OPENCODE_URL: https://github.com/anomalyco/opencode/releases/download/v1.18.34/opencode-linux-x64.tar.gz
        run: |
          curl --fail --silent --show-error --location "$OPENCODE_URL" -o "$RUNNER_TEMP/opencode.tar.gz"
          echo "0f22479647226d1d2dd99595d20082ee7bda3870b62dc6a90b41efc1a71d7e9a  $RUNNER_TEMP/opencode.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/assessment-opencode"
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/assessment-opencode"
          test "$("$RUNNER_TEMP/assessment-opencode/opencode" --version)" = '1.18.34'
          echo "$RUNNER_TEMP/assessment-opencode" >> "$GITHUB_PATH"
      - name: Produce independent structured assessment with read-only tools
        env:
          GH_TOKEN: ${{ github.token }}
          KIMI_API_KEY: ${{ secrets.KIMI_FOR_CODING_API_KEY }}
          ASSESSMENT_COMMAND: model
        run: nbb -cp .github/scripts:.assessment-policy/skills/pr-flow/scripts .github/scripts/assessment_route.cljs
      - name: Record producer artifact name
        id: assessment-artifact
        env:
          ASSESSMENT_ARTIFACT_NAME: scoped-assessment-${{ github.run_id }}-${{ github.run_attempt }}
        run: echo "name=$ASSESSMENT_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - name: Preserve immutable input and actual structured result
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.assessment-artifact.outputs.name }}
          path: |
            ${{ runner.temp }}/assessment-input.edn
            ${{ runner.temp }}/assessment-result.edn
          if-no-files-found: error
          retention-days: 14

  scoped-assessment-publish:
    name: Fresh OpenCode App scoped publisher
    needs: scoped-assessment-read
    if: ${{ github.event_name == 'issue_comment' && needs.scoped-assessment-read.result == 'success' }}
    concurrency:
      group: opencode-kimi-assessment-14
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    env:
      ASSESSMENT_POLICY: .assessment-policy/skills/pr-flow
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: riatzukiza/.agents
          ref: 0f95afe56fb01fbcf9d7934b72ce31fe96baf451
          path: .assessment-policy
          persist-credentials: false
      # Same reviewed runtime/auth bytes as the read job; no local broker.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: open-hax/proxx
          ref: 2810f4515424a146fe37390fb0baf532cca31236
          path: .assessment-runtime
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - name: Install pinned portable runtime
        working-directory: .github/assessment-tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/.github/assessment-tools/node_modules/.bin" >> "$GITHUB_PATH"
          {
            echo "ASSESSMENT_INPUT=$RUNNER_TEMP/assessment-input.edn"
            echo "ASSESSMENT_RESULT=$RUNNER_TEMP/assessment-result.edn"
            echo "ASSESSMENT_READBACK=$RUNNER_TEMP/assessment-readback.edn"
          } >> "$GITHUB_ENV"
      - name: Require successful producer artifact name
        env:
          ASSESSMENT_ARTIFACT_NAME: ${{ needs.scoped-assessment-read.outputs.artifact-name }}
        run: test -n "$ASSESSMENT_ARTIFACT_NAME"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.scoped-assessment-read.outputs.artifact-name }}
          path: ${{ runner.temp }}
      - name: Reverify native context and submission before App mint
        env:
          GH_TOKEN: ${{ github.token }}
          ASSESSMENT_COMMAND: check
        run: nbb -cp .github/scripts:.assessment-policy/skills/pr-flow/scripts .github/scripts/assessment_route.cljs
      - name: Publish and read back with the existing OpenCode App
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const cp = require('node:child_process');
            const file = `${process.env.GITHUB_WORKSPACE}/.assessment-runtime/.github/scripts/opencode-app-auth.cjs`;
            if (crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex') !== 'fd4d5630c462f0f202ac20e39ec1433fba4dfa13e12a6f6ffd5c0ec035d2a7e1') throw new Error('Reviewed App helper bytes changed');
            const { withOpenCodeAppToken } = require(file);
            await withOpenCodeAppToken({ core }, async token => {
              cp.execFileSync('nbb', ['-cp', '.github/scripts:.assessment-policy/skills/pr-flow/scripts', '.github/scripts/assessment_route.cljs'], {
                env: { ...process.env, GH_TOKEN: token, GITHUB_TOKEN: '', ASSESSMENT_COMMAND: 'publish' },
                stdio: ['ignore', 'pipe', 'pipe'], timeout: 360000,
              });
            });
      - name: Preserve actual native readback and classification
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scoped-assessment-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assessment-readback.edn
          if-no-files-found: error
          retention-days: 14

  daily-issue-sweep:
    name: Daily OpenCode issue sweep
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run daily OpenCode issue sweep
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIMI_API_KEY: ${{ secrets.KIMI_FOR_CODING_API_KEY }}
        with:
          model: kimi-for-coding/k2p5
          use_github_token: true
          prompt: |
            Perform a daily maintenance sweep of this repository's open GitHub issues.

            Kanban context:
            - Prioritize issues with the `kanban` label or an `openhax-kanban-sync` marker.
            - Use `status:*` and `priority:*` labels to understand current task state.
            - Do not duplicate synced Kanban issues; update/comment on the existing issue instead.
            - If a synced issue appears stale, recommend the next Kanban status transition rather than inventing a new workflow.

            Scope:
            - Use the GitHub API or gh CLI with GITHUB_TOKEN to inspect open issues, excluding pull requests.
            - Prioritize issues updated recently or issues with no maintainer response.
            - Limit active changes to at most five issues per run to avoid noisy automation.

            For each issue you act on:
            - Close only clearly irrelevant, spam, out-of-scope, or duplicate issues, and always leave a short reason.
            - If more information is needed, ask concrete follow-up questions and leave the issue open.
            - If a small, safe fix is appropriate, create a branch, commit the fix, and open a linked pull request.
            - If the issue needs human judgment or larger design work, summarize the next recommended step and leave it open.

            Guardrails:
            - Do not spam repeat comments; skip issues where the latest maintainer/agent response is still current.
            - Do not make broad rewrites, dependency churn, secret changes, or destructive changes.
            - Never print secrets or credentials.
